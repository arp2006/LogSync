[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ulpf"
version = "0.1.0"
description = "Universal Log Pre-processing Framework (ULPF) - Lossless Security Telemetry Ingestion and Normalization"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]",
  "pydantic>=2.7.0",
  "pydantic-settings",
  "SQLAlchemy>=2.0.0",
  "psycopg[binary]",
  "alembic",
  "python-multipart",
]

[project.optional-dependencies]
dev = [
  "pytest",
  "httpx",
  "ruff",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "RUF"]
ignore = ["B008"]

[tool.ruff.lint.isort]
known-first-party = ["ulpf"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
filterwarnings = [
  "ignore::DeprecationWarning",
]
